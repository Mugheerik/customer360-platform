name: Customer360 CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test & Quality Checks

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer360

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d customer360"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/customer360
      JWT_SECRET_KEY: customer360-ci-secret-key-at-least-32-characters
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format . --check

      - name: Debug environment
        shell: bash
        run: |
          echo "DATABASE_URL=$DATABASE_URL"
          echo "JWT_ALGORITHM=$JWT_ALGORITHM"
          echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=$JWT_ACCESS_TOKEN_EXPIRE_MINUTES"

          if [ -n "$JWT_SECRET_KEY" ]; then
            echo "✅ JWT_SECRET_KEY is set"
          else
            echo "❌ JWT_SECRET_KEY is MISSING"
            exit 1
          fi

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest ../../tests