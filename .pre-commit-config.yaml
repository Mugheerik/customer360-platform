repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args:
          - --config
          - apps/api/pyproject.toml
          - --fix

      - id: ruff-format
        args:
          - --config
          - apps/api/pyproject.toml

  - repo: local
    hooks:
      - id: pytest
        name: Backend Tests
        entry: uv run --project apps/api pytest tests
        language: system
        pass_filenames: false

      - id: pip-audit
        name: Backend Dependency Audit
        entry: uv run --project apps/api pip-audit
        language: system
        pass_filenames: false