
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-customer360}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-customer360}"]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      # Overrides the localhost URL in your .env: inside Docker the host is "postgres"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-customer360}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata: